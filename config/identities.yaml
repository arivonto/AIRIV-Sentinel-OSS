# AIRIV Sentinel — Explicit Tmux Identity Mapping
#
# Identity resolution is configuration-driven.
# The Tmux parser MUST NOT infer agent identity from commands.

session: airiv

identities:

  ollama:
    endpoint: http://localhost:11434
    model: qwen3:4b
    windows:
      - ollama
      - local_llm

  airiv_system:
    windows:
      - airiv
      - server
      - worker

  system_terminal:
    windows:
      - terminal
      - system
