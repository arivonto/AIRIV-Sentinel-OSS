schema: airiv.sentinel.authenticity/v1

operational_truth_precedence:
  1: REAL_OBSERVATION
  2: VERIFIABLE_EVIDENCE
  3: VERIFIED_SYSTEM_STATE
  4: EXECUTION_AND_VERIFICATION_RECORD
  5: CANONICAL_OPERATIONAL_EXPERIENCE
  6: KNOWLEDGE
  7: DOCUMENTATION
  8: MODEL_INFERENCE

epistemic_states:
  FACT:
    meaning: directly_supported_by_verified_evidence
  PLANNED:
    meaning: approved_direction_not_yet_proven
  HYPOTHESIS:
    meaning: proposed_explanation_requiring_verification
  UNKNOWN:
    meaning: insufficient_evidence

rules:
  - REALITY_OUTRANKS_INFERENCE
  - EVIDENCE_OUTRANKS_NARRATIVE
  - DOCUMENTATION_DESCRIBES_REALITY_BUT_DOES_NOT_CREATE_IT
  - MODEL_OUTPUT_IS_NOT_OPERATIONAL_FACT
  - MISSING_EVIDENCE_EQUALS_UNKNOWN
  - CONTRADICTORY_EVIDENCE_EQUALS_DRIFT_OR_INCIDENT
  - SUCCESS_REQUIRES_INDEPENDENT_VERIFICATION
  - LEARNING_REQUIRES_VERIFIED_OPERATIONAL_EXPERIENCE
