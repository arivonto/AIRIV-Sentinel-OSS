name: Feature request
description: Propose a bounded capability or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests that affect production authority, remediation, privilege, or autonomous behavior must explain the safety boundary they preserve or introduce.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem should Sentinel solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful capability or change.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Safety / authority boundary
      description: Which contract, policy, target, privilege, verification, or evidence boundary is affected?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: What tests or observable evidence would prove the feature works safely?
